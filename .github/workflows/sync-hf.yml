name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Validate Python syntax before Space sync
        run: python -m compileall backend etl airflow scripts frontend/streamlit_app.py manage.py tests

      - name: Stamp app revision
        run: |
          echo "${GITHUB_SHA}" > REVISION
          git add -f REVISION
          echo "ENV NOVA_APP_COMMIT=${GITHUB_SHA}" >> Dockerfile

      - name: Inject Hugging Face Space metadata into README.md
        run: |
          python -c "
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          if not content.startswith('---'):
              frontmatter = '---\ntitle: Movie Rec Api\nemoji: 🎬\ncolorFrom: indigo\ncolorTo: purple\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(frontmatter + content)
              print('Injected HF frontmatter into README.md for Space deployment')
          else:
              print('README.md already contains HF frontmatter, skipping injection')
          "

      - name: Ensure Movie Catalog exists on Hugging Face Model Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install pyarrow huggingface_hub
          python -c "
          import os, urllib.request, json
          from huggingface_hub import HfApi
          import pyarrow.parquet as pq

          api = HfApi(token=os.environ['HF_TOKEN'])
          model_repo = 'pavanbadempet/movie-recs-models'
          print(f'Checking if movies_catalog.json exists in {model_repo}...')
          try:
              files = api.list_repo_files(model_repo)
              if 'movies_catalog.json' not in files:
                  print('Downloading movies_transformed.parquet to extract movies_catalog.json...')
                  parquet_url = f'https://huggingface.co/{model_repo}/resolve/main/movies_transformed.parquet'
                  urllib.request.urlretrieve(parquet_url, 'movies_temp.parquet')
                  t = pq.read_table('movies_temp.parquet', columns=['id', 'title', 'overview', 'genres', 'vote_average', 'vote_count', 'popularity', 'release_date', 'poster_path'])
                  with open('movies_catalog.json', 'w', encoding='utf-8') as f:
                      json.dump(t.to_pylist(), f, separators=(',', ':'))
                  print('Uploading movies_catalog.json (36MB) to model hub...')
                  api.upload_file(
                      path_or_fileobj='movies_catalog.json',
                      path_in_repo='movies_catalog.json',
                      repo_id=model_repo,
                      repo_type='model'
                  )
                  if os.path.exists('movies_temp.parquet'):
                      os.remove('movies_temp.parquet')
                  if os.path.exists('movies_catalog.json'):
                      os.remove('movies_catalog.json')
                  print('movies_catalog.json published successfully to Model Hub!')
              else:
                  print('movies_catalog.json already exists in Model Hub.')
          except Exception as e:
              print('Warning while ensuring catalog in hub:', e)
          "

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          print('Uploading repository to Hugging Face Spaces...')
          api.upload_folder(
              folder_path='.',
              repo_id='pavanbadempet/movie-rec-api',
              repo_type='space',
              ignore_patterns=[
                  '.git/*',
                  '.github/*',
                  '.hypothesis/*',
                  '.mypy_cache/*',
                  '.pytest_cache/*',
                  '.ruff_cache/*',
                  '.wrangler/*',
                  '.agents/*',
                  '.kiro/*',
                  'node_modules/*',
                  'frontend/node_modules/*',
                  'frontend/coverage/*',
                  'tests/*',
                  'tests/**/*',
                  '**/*.pyc',
                  '**/__pycache__/*',
                  # Binary model files (HF requires Xet storage for binaries)
                  '*.onnx',
                  '*.onnx.data',
                  '*.tq',
                  'models/*',
                  'models/**/*',
                  'backend/models/*.index',
                  'backend/models/*.npy',
                  'backend/models/*.joblib',
                  'backend/models/*.joblib.metadata.json',
                  'backend/models/pipeline_manifest.json',
                  'backend/models/onnx/*',
                  # Large data directories
                  'data/processed/*.parquet',
                  'data/bronze/*',
                  'data/silver/*',
                  'data/gold/*',
                  'data/manifests/*',
                  'data/quality/*',
                  # System binaries
                  '.hadoop/*',
                  # Database and logs
                  '*.sqlite3',
                  '*.log',
                  '*.err',
              ]
          )
          print('Uploading REVISION file explicitly...')
          api.upload_file(
              path_or_fileobj='REVISION',
              path_in_repo='REVISION',
              repo_id='pavanbadempet/movie-rec-api',
              repo_type='space'
          )
          print('Upload complete!')
          "
