stages:
  - test
  - deploy

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

syntax-check:
  stage: test
  image: python:3.12-slim
  script:
    - python -m compileall backend etl airflow scripts manage.py tests

sync-huggingface:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $HF_TOKEN && $CI_COMMIT_BRANCH == "main"
  script:
    - pip install huggingface_hub
    - python scripts/hf_upload.py
